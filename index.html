<!doctype html>
<html lang="ar-TN" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="المكينة: لعبة بلوف تونسية. العب ضد البوتات ولا مع صحابك أونلاين.">
<title>المكينة</title>
<link rel="icon" href="data:,">
<style>/* El Makina, mobile table (v3). Portrait phone first; landscape phones get a side dock.
 * v2: no fixed label below 11px, tap targets of 44px, names clear of badges and rings.
 * v3: 4.5:1 text on every coloured button and stamp, coin changes beside the count, a reveal card
 * over the felt, notes as toasts, a lethal-stakes edge on the dock, a full-height landscape panel. */
:root{
  --bg:#0b0a17;--ink:#f7f2e8;--muted:#b3afcf;--gold:#f4c55c;--orange:#ff9d42;
  --attack:#ff7a66;--block:#6cc7e6;--challenge:#b48cff;--good:#79dfa2;--bad:#ff6b6b;
  --felt-edge:#08201c;--av:clamp(46px,13.6vw,60px);--mini:clamp(15px,4.4vw,20px);--card:clamp(62px,21vw,94px);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --font:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Kufi Arabic",Arial,sans-serif;
  color-scheme:dark;font-family:var(--font);
  -webkit-text-size-adjust:100%;text-size-adjust:100%
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#06050d;color:var(--ink)}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{-webkit-user-drag:none;user-select:none}
[hidden]{display:none!important}
.symbols{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* Frame */
.game{position:relative;height:100%;height:100dvh;max-width:520px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding-top:var(--safe-t);overflow:hidden;isolation:isolate;
  background:radial-gradient(130% 70% at 50% 30%,#2e2f6e 0%,#1b1c48 44%,#0f0d22 80%,#0b0a17 100%)}
.game::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(45deg,#ffffff06 0 2px,transparent 2px 10px)}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px 4px;min-height:50px}
.hud-btn{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff22;transition:transform .1s}
.hud-btn:active{transform:scale(.92)}
.hud-btn .i{width:22px;height:22px}
.hud-btn[aria-pressed=false]{color:var(--muted)}
.turn-chip{flex:1;min-width:0;height:38px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border-radius:19px;background:#0008;border:1px solid #ffffff1c;font-size:13px}
.turn-chip b{color:var(--gold);white-space:nowrap}
#phase-label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-face{font-size:19px;line-height:1}
.clock{min-width:46px;height:30px;padding:0 8px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--gold);background:#f4c55c1c;border:1px solid #f4c55c55;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock:empty{display:none}
.clock-box{display:block;height:1.4em;line-height:1.4em;overflow:hidden}
.clock-strip{display:flex;flex-direction:column;will-change:transform}
.clock-strip i{font-style:normal;height:1.4em;white-space:nowrap}
.clock.urgent{color:#ffe0da;background:#ff6b6b3a;border-color:#ff6b6bb0;animation:urgent .8s ease-in-out infinite}

/* Felt table */
.table{position:relative;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;margin:0 8px;padding:6px 4px 2px;border-radius:30px 30px 24px 24px;container-type:size;isolation:isolate;
  background:radial-gradient(ellipse 90% 70% at 50% 42%,#21796a 0%,#175a4e 42%,#103f37 78%,#0c2f29 100%);
  box-shadow:inset 0 0 0 3px var(--felt-edge),inset 0 0 0 6px #d29c4466,inset 0 16px 40px #0008,0 12px 28px #000a}
.table::before{content:'EL MAKINA';position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-8deg);font:700 clamp(26px,9vw,44px)/1 var(--font);letter-spacing:4px;color:#ffffff09;pointer-events:none;z-index:-1;white-space:nowrap}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.link{fill:none;stroke-width:3;stroke-linecap:round;opacity:.92}
.link.attack{stroke:var(--attack);stroke-dasharray:9 7}
.link.blocked{stroke:var(--block);stroke-dasharray:3 7}
.link.canceled{stroke:#a69bb0;stroke-dasharray:2 7;opacity:.55}
.link.block{stroke:var(--block);stroke-width:3.4}
.link.challenge{stroke:var(--challenge);stroke-width:3.6;stroke-dasharray:.5 8}
.link.preview{stroke:var(--gold);stroke-dasharray:5 7;opacity:.85;animation:flow 1s linear infinite}
.link.past{opacity:.45}
.link.enter{animation:link-in .45s ease-out both}

/* Opponents sit on the far arc: left, top, right (turn order runs bottom, left, top, right). */
.opponents{direction:ltr;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;align-items:start;position:relative;z-index:3}
.opponents>.seat{direction:rtl}
#seat-bot1{grid-column:1;margin-top:24px}#seat-bot2{grid-column:2}#seat-bot3{grid-column:3;margin-top:24px}
.seat{position:relative;transition:filter .4s}
.seat.opp{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.seat.opp .who{gap:10px}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;min-width:44px;max-width:100%;padding:2px 4px;border-radius:16px}
.avatar{position:relative;width:var(--av);height:var(--av);border-radius:50%;display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .3s;
  background:var(--c);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 5px var(--c),0 8px 16px #000a}
.face{font-size:calc(var(--av) * .56);line-height:1;transform:translateY(1px);filter:drop-shadow(0 2px 2px #0007)}
.nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.nm em{font-style:normal;font-size:12px;color:#2a1904;background:var(--gold);border-radius:5px;padding:0 4px;margin-inline-start:2px;text-shadow:none}
.purse{position:relative;display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:15px;color:var(--gold);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.purse img{width:19px;height:19px;filter:drop-shadow(0 1px 1px #0009)}
.coins{display:inline-block;min-width:1ch}
.coins.up{animation:bump-up .55s}.coins.down{animation:bump-down .55s}
.delta{position:absolute;top:-15px;inset-inline-start:calc(100% - 6px);padding:0 5px;border-radius:7px;font:700 12px/16px var(--font);direction:ltr;unicode-bidi:isolate;white-space:nowrap;box-shadow:0 2px 4px #0008}
.purse .delta{position:relative;top:auto;inset-inline-start:auto;margin-inline-start:2px;align-self:center}
.delta.positive{background:var(--gold);color:#2a1904}.delta.negative{background:#ff8a78;color:#2d0700}.delta.zero{background:#cfcde0;color:#1d1736}
.delta small{font-size:12px;margin-inline-start:2px}
.mini-backs{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--mini) * 1.48);padding-inline:2px}
.mini-backs img{width:var(--mini);height:calc(var(--mini) * 1.48);border-radius:3px;margin-inline:-1.5px;object-fit:cover;box-shadow:0 2px 4px #0009}
.mini-backs img:first-child:not(:last-child){transform:rotate(-9deg)}.mini-backs img:nth-child(3){transform:rotate(9deg)}
.lost-slot{display:inline-grid;place-items:center;flex:none;width:var(--mini);height:calc(var(--mini) * 1.48);margin-inline:1px;border:1.5px dashed #ff9c8dcc;border-radius:3px;color:#ffc6bd;font:700 12px var(--font);background:#ff7a6618;direction:ltr}
.replaced-mark{display:inline-grid;place-items:center;align-self:center;width:18px;height:18px;margin-inline-start:3px;border-radius:50%;background:#13213f;border:1px solid var(--block);color:var(--block)}
.replaced-mark .i{width:11px;height:11px}
.claim-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;margin-top:3px;padding:2px 7px 2px 3px;border-radius:9px;border:1.5px dashed var(--gold);background:#0b231fdd;font-size:12px;font-weight:700;color:#ffe3a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.claim-chip img{width:14px;height:21px;object-fit:contain;border-radius:2px}
.claim-chip.old{opacity:.62;border-style:dotted}
.claim-chip.caught{border-color:var(--bad);color:#ffc5bc}.claim-chip.proven{border-color:var(--good);color:#cdf6dc}
.claim-chip.pickable{position:relative;overflow:visible;border-style:solid;cursor:pointer}.claim-chip.pickable::after{content:'';position:absolute;inset:-9px -4px}.claim-chip.pickable[aria-pressed=true]{background:#5a3b8e;border-color:var(--challenge);color:#fff}
.seat-label{font-size:12px;font-weight:700;min-height:15px;max-width:100%;color:#fbe9bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.badges{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:3}
.badge{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#0d1a2b;border:2px solid currentColor;box-shadow:0 2px 4px #0009;animation:pop .32s cubic-bezier(.2,1.7,.4,1) both}
.badge .i{width:11px;height:11px;stroke-width:2.7}
.badge.actor{color:var(--attack)}.badge.target{color:var(--gold)}.badge.blocker{color:var(--block)}.badge.challenger{color:var(--challenge)}.badge.winner{color:var(--gold);background:#3b2c0b}.badge.out{color:#e2e2e2}
.ring{position:absolute;inset:-8px;border-radius:50%;opacity:0;transition:opacity .2s;pointer-events:none;
  background:conic-gradient(var(--ring-c,var(--gold)) calc(var(--ring,1) * 1turn),#ffffff2a 0);
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,#0000 calc(100% - 4px),#000 calc(100% - 3.5px))}
.seat.timed .ring{opacity:1}.seat.urgent .ring{--ring-c:var(--bad)}
.seat.current .avatar{transform:scale(1.08);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 5px var(--gold),0 0 24px #f4c55c88}
.seat.target .avatar{box-shadow:0 0 0 3px var(--felt-edge),0 0 0 5px var(--attack),0 0 20px #ff7a6670}
.seat.winner .avatar{transform:scale(1.12);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 6px var(--gold),0 0 34px #f4c55cc0}
.seat.out{filter:grayscale(1) brightness(.5)}
.seat.hit .avatar{animation:shake .5s}
.seat.hit::after{content:'';position:absolute;left:50%;top:calc(var(--av) / 2);width:calc(var(--av) * 1.6);height:calc(var(--av) * 1.6);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#ff6b6b88,transparent 65%);animation:fade-out .6s both;pointer-events:none}
.seat.shielded .avatar::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--block);box-shadow:0 0 18px var(--block),inset 0 0 12px var(--block);animation:shield 1s ease-out both}
.seat.glow .avatar{animation:glow .7s}
.seat.inspected .mini-backs{animation:peek .8s}
.seat.shuffling .mini-backs img,.seat.shuffling .hand-card{animation:shuffle .6s}
.think{display:none;position:absolute;top:-6px;inset-inline-start:-10px;gap:3px;padding:5px 6px;border-radius:10px;background:#fffdf6;box-shadow:0 2px 6px #0009;z-index:4}
.seat.thinking .think{display:flex}
.think i{width:5px;height:5px;border-radius:50%;background:#2b2450;animation:dots 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
.seat.targetable .avatar{animation:beckon 1.1s ease-in-out infinite}
.seat.selected .avatar{animation:none;transform:scale(1.1);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 6px var(--gold),0 0 28px #f4c55c}

/* Middle: bank, stage, deck */
.middle{position:relative;z-index:2;display:grid;grid-template-columns:50px minmax(0,1fr) 50px;grid-template-rows:minmax(0,1fr);align-items:center;min-height:0}
.bank,.deck{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:#f1e4b6;text-shadow:0 1px 2px #000}
.bank img{width:30px;height:30px;filter:drop-shadow(0 3px 3px #0008)}
.bank .delta{top:-10px;inset-inline-start:auto;left:50%;transform:translateX(-50%)}
.deck img{width:30px;height:44px;border-radius:4px;box-shadow:2px 2px 0 #333,4px 4px 0 #1a1a1a,0 6px 10px #0009}
.stage{container-type:size;align-self:stretch;height:auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;border-radius:22px;--ev:var(--gold)}
.stage-art{position:relative;display:flex;align-items:center;justify-content:center;gap:10px}
.stage-card{position:relative;display:inline-flex;padding:3px;border-radius:12px;animation:card-in .4s cubic-bezier(.2,1.3,.4,1) both}
.stage-card img{display:block;height:clamp(40px,calc(100cqh - 70px),150px);aspect-ratio:.68;object-fit:contain;filter:drop-shadow(0 8px 10px #000a)}
.stage-card.f-claim{border:2px dashed var(--gold)}
.stage-card.f-proof{border:2px solid #e3f2ff;background:#e3f2ff1a;box-shadow:0 0 22px #e3f2ff55}
.stage-card.f-false{border:2px solid var(--bad)}
.stage-card.f-false img{filter:grayscale(.8) brightness(.6)}
.stage-card .x{position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-size:clamp(28px,30cqh,64px);font-weight:700;text-shadow:0 3px 8px #000}
.stage-card.flip{animation:flip .55s ease-out both}
.ev-sym{width:clamp(30px,26cqh,54px);height:clamp(30px,26cqh,54px);border-radius:50%;display:grid;place-items:center;color:var(--ev);border:2px solid currentColor;background:#0b1f1ccc;box-shadow:0 0 16px #0008}
.ev-sym .i{width:55%;height:55%}
.accused{position:relative;display:inline-flex}
.accused img{width:clamp(16px,14cqh,28px);aspect-ratio:.68;object-fit:contain;border:1.5px dashed var(--gold);border-radius:3px}
.accused b{position:absolute;top:-7px;inset-inline-start:-7px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#201c1b;font-size:12px}
.duel{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:100%;font-size:12px;font-weight:700}
.duel-person{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-shadow:0 1px 2px #000}
.duel-person i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);font-size:12px}
.duel-arrow{display:flex;color:var(--ev)}.duel-arrow .i{width:16px;height:16px}
.stamp{font-size:12px;font-weight:700;border-radius:7px;padding:2px 10px;line-height:1.6;white-space:nowrap;animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp.claim{color:#ffe3a3;border:1.5px dashed var(--gold);background:#0b231fcc}
.stamp.proof{color:#0c2235;background:#e3f2ff}
.stamp.false{color:#fff;background:#c8302f}
.stamp.result{color:#2a1904;background:var(--gold)}
.stamp.block{color:#04202c;background:var(--block)}
.stamp.hit{color:#fff;background:#c2391f}
.stamp.challenge{color:#fff;background:#6e40cf}
.verdicts{display:flex;gap:8px;justify-content:center}
.verdict{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border-radius:12px;background:#0b231fcc;border:2px solid var(--good);animation:flip .55s ease-out both}
.verdict.false{border-color:var(--bad)}
.verdict img{height:clamp(34px,calc(100cqh - 96px),110px);aspect-ratio:.68;object-fit:contain}
.verdict.false img{filter:brightness(.55)}
.verdict span{font-size:12px;font-weight:700}.verdict.false span{color:#ffc5bc}.verdict:not(.false) span{color:#cdf6dc}
.absence{display:flex;gap:6px}
.absence img{height:clamp(34px,calc(100cqh - 70px),110px);aspect-ratio:.68;object-fit:contain;animation:flip .55s ease-out both}
.absence img:nth-child(2){animation-delay:.12s}.absence img:nth-child(3){animation-delay:.24s}
.loss-mark{display:flex;align-items:center;gap:8px;color:#ffb2a6;font:700 clamp(20px,18cqh,36px)/1 var(--font);direction:ltr}
.loss-mark img{height:clamp(36px,calc(100cqh - 70px),110px);aspect-ratio:.68;object-fit:contain;animation:drop .5s ease-in both}
.coin-burst{display:flex;align-items:center;gap:6px;font:700 clamp(20px,20cqh,40px)/1 var(--font);color:var(--gold);direction:ltr;text-shadow:0 3px 8px #000}
.coin-burst img{width:clamp(26px,26cqh,52px);height:auto;animation:spin-in .5s ease-out both}
.flow{display:flex;align-items:center;gap:8px;color:var(--block)}
.flow img{height:clamp(34px,calc(100cqh - 70px),100px);aspect-ratio:.68;object-fit:contain}
.flow .i{width:22px;height:22px}

/* Step rail + caption */
.trace{position:relative;z-index:3;justify-self:center;display:flex;align-items:center;gap:8px;max-width:calc(100% - 8px);min-height:44px;margin:2px 0 4px;padding:4px 10px;border-radius:14px;background:#0009;border:1px solid #ffffff1f}
.trace-text{display:flex;flex-direction:column;min-width:0;text-align:start}
#headline{font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#eyebrow{font-size:12px;color:#dcd7f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;align-items:center;flex:none}
.rail:empty{display:none}
.step{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;border:2px solid #5d6383;background:#141a33;color:#9aa0bd}
.step .i{width:12px;height:12px;stroke-width:2.6}
.step img{width:12px;height:18px;object-fit:contain}
.step.done{border-color:#a99fc4;color:#e4ddf3}
/* The live step pulses three times, then rests: an endless pulse costs main-thread time on slow phones. */
.step.now{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px #f4c55c33;animation:beat 1.2s ease-in-out 3}
.step.next{opacity:.5;border-style:dashed}.step.skip{opacity:.4}.step.void{opacity:.2;border-style:dotted}
.step.ok{border-color:var(--good);color:var(--good)}.step.bad{border-color:var(--bad);color:var(--bad)}.step.stop{border-color:var(--block);color:var(--block)}
.trace[data-outcome=canceled] .step.effect.stop{border-color:var(--bad);color:var(--bad)}
.rail-line{width:7px;height:2px;background:#6b7091;flex:none}.rail-line.next,.rail-line.void,.rail-line.skip{opacity:.35}

/* You */
.seat.me{display:flex;flex-direction:column;align-items:center;z-index:4;padding-bottom:4px}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--card) * 1.47 + 8px);padding-top:8px}
.hand-card{--rot:calc((var(--i) - (var(--n) - 1) / 2) * 7deg);--lift:calc(var(--d,0) * 1px);position:relative;width:var(--card);aspect-ratio:.68;margin-inline:calc(var(--card) * -.06);border-radius:10px;transform-origin:50% 120%;transform:rotate(var(--rot)) translateY(var(--lift));transition:transform .28s cubic-bezier(.2,1.3,.4,1),filter .2s}
.hand-card img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 8px #000b)}
.hand-card:active{--d:-10}
.hand-card.selectable{filter:drop-shadow(0 0 7px #ff8e7d88)}
.hand-card.selectable img{animation:nudge 1.4s ease-in-out infinite}
.hand-card.selectable::after{content:'اضغط';position:absolute;top:4px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:7px;background:#2b1d45ee;color:#f3e9ff;font-size:12px;font-weight:700;white-space:nowrap}
.hand-card.selected{--d:-20;z-index:3;filter:drop-shadow(0 0 12px var(--bad))}
.hand-card.selected img{animation:none}
.hand-card.selected::after{content:'✕ نخسرها';background:#c8302f;color:#fff}
.hand-card::after{max-width:100%;overflow:hidden;text-overflow:clip;box-sizing:border-box}
.hand-card.fresh::before{content:'جديدة';position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:2;padding:0 6px;border-radius:8px;background:var(--block);color:#04202c;font-size:12px;font-weight:700;white-space:nowrap}
.hand .lost-slot{width:calc(var(--card) * .62);height:calc(var(--card) * .62 * 1.47);border-radius:8px;font-size:15px;margin-inline:6px;align-self:center}
.me-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;min-height:40px}
.seat.me .who{flex-direction:row;gap:13px}
.seat.me .avatar{--av:36px}
.seat.me .face{font-size:21px}
.seat.me .purse{font-size:19px}.seat.me .purse img{width:24px;height:24px}
.seat.me .badges{bottom:-8px}.seat.me .badge{width:17px;height:17px}.seat.me .badge .i{width:9px;height:9px}
.seat.me .claim-chip{margin-top:0}

/* Effects layer */
.fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:visible}
.bubble{--bb:#fffdf6;position:absolute;transform:translate(-50%,0);display:flex;align-items:center;gap:5px;max-width:min(240px,70vw);padding:5px 10px;border-radius:14px;background:var(--bb);color:#1d1736;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 6px 14px #000b;animation:bubble-in .34s cubic-bezier(.2,1.7,.4,1) both}
.bubble::before{content:'';position:absolute;left:var(--tail,50%);top:-6px;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--bb)}
.bubble.up::before{top:auto;bottom:-6px;border-bottom:0;border-top:7px solid var(--bb)}
.bubble img{width:18px;height:26px;object-fit:contain}
.bubble .i{width:16px;height:16px}
.bubble.challenge{--bb:#6e40cf;color:#fff}.bubble.block{--bb:#7fd3f0;color:#04202c}.bubble.true{--bb:#7fe2a8;color:#062b16}.bubble.false{--bb:#c8302f;color:#fff}
.bubble.machine{--bb:#ffd2a8;color:#3a1500}
.bubble.tax{--bb:#ffd77a;color:#2a1904}.bubble.pass{--bb:#1e1a38;color:#dcd7f2;font-size:12px;box-shadow:0 0 0 1px #ffffff2a,0 6px 14px #000b}.bubble.taunt{--bb:#fff3d6;color:#3b2a0a;font-size:12px}
.bubble.out{animation:bubble-out .22s ease-in both}
.bubble.up{transform:translate(-50%,0);animation-name:bubble-in-up}.bubble.up.out{animation:bubble-out-up .22s ease-in both}
.duel-arrow .i,.btn .i use[href='#i-play']{fill:currentColor}
.fly{position:absolute;left:0;top:0;width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 3px 3px #0009);will-change:transform}
.fly.card{width:34px;height:50px;border-radius:4px}
.banner{position:absolute;left:50%;top:44%;z-index:40;transform:translate(-50%,-50%);max-width:calc(100% - 24px);font-size:clamp(24px,8vw,36px);font-weight:700;line-height:1.15;text-align:center;color:#ffe08a;white-space:normal;text-shadow:0 3px 0 #7a4a00,0 8px 22px #000;animation:banner 1.3s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}
.banner.bad{color:#ffd0c8;text-shadow:0 3px 0 #6b1408,0 8px 22px #000}
.confetti{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;will-change:transform}

/* Dock */
.dock{position:relative;z-index:5;display:flex;flex-direction:column;gap:8px;min-height:122px;max-height:66dvh;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(12px + var(--safe-b));border-radius:22px 22px 0 0;background:linear-gradient(180deg,#25204a 0%,#17132f 100%);box-shadow:0 -12px 30px #000b,inset 0 1px 0 #ffffff22}
.d-head{display:flex;align-items:center;gap:10px;min-width:0}
.d-head h1{margin:0;font-size:17px;line-height:1.3;font-weight:700}
.d-head h1:focus{outline:none}
.d-head p{margin:2px 0 0;font-size:12.5px;line-height:1.45;color:#d2cde9}
.d-copy{min-width:0;flex:1}
.d-face{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:23px;background:var(--c);box-shadow:0 0 0 2px #0b0a17,0 0 0 4px var(--c)}
/* Mixed colours only where color-mix() exists: a var() declaration would otherwise beat the plain fallback above and compute to nothing. */
@supports (color: color-mix(in srgb, red 50%, blue)){
 .avatar{background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c) 52%,#fff) 0,var(--c) 52%,color-mix(in srgb,var(--c) 58%,#000) 100%);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 5px color-mix(in srgb,var(--c) 78%,transparent),0 8px 16px #000a}
 .ev-sym{box-shadow:0 0 16px color-mix(in srgb,var(--ev) 40%,transparent)}
 .d-face{box-shadow:0 0 0 2px #0b0a17,0 0 0 4px color-mix(in srgb,var(--c) 70%,transparent)}
}
.d-art{width:38px;flex:none;aspect-ratio:.68;object-fit:contain;filter:drop-shadow(0 3px 4px #0009)}
.d-art.claim{outline:2px dashed var(--gold);outline-offset:2px;border-radius:4px}
.d-actions{display:flex;gap:9px}
.d-actions>.btn{flex:1;min-width:0}
.d-choices{min-width:0}
.timer{position:absolute;top:0;left:20px;right:20px;height:4px;border-radius:0 0 3px 3px;background:#ffffff1c;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:right center;will-change:transform}
.timer.urgent i{background:var(--bad)}
.tip{display:block;margin-top:3px;font-size:12px;line-height:1.45;color:#ffe9b3;background:#f4c55c14;border:1px dashed #f4c55c70;border-radius:10px;padding:4px 8px}
.live{display:flex;align-items:center;gap:10px;min-height:56px}
.live .d-copy{font-size:14px;font-weight:700;line-height:1.4}
.live small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ff{flex:none;display:flex;align-items:center;gap:4px;min-height:44px;padding:0 14px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff26;font-weight:700;font-size:13px;color:var(--gold)}
.ff .i{width:18px;height:18px;fill:currentColor;stroke:none}
.btn{position:relative;min-height:56px;padding:7px 10px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:15.5px;line-height:1.25;text-align:center;box-shadow:0 5px 0 #0009,inset 0 1px 0 #ffffff4a;transition:transform .07s,box-shadow .07s,opacity .2s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #0009,inset 0 1px 0 #ffffff4a}
.btn small{font-size:12px;font-weight:700;opacity:.86}
.btn .i{width:20px;height:20px}
.btn-row{display:flex;align-items:center;gap:6px}
.btn.primary{background:linear-gradient(180deg,#ffe18f,#f0b33a);color:#2a1904}
.btn.danger{background:linear-gradient(180deg,#8452e0,#6230c0);color:#fff}
.btn.block{background:linear-gradient(180deg,#a3e8ff,#43a6d2);color:#04202c}
.btn.red{background:linear-gradient(180deg,#cf3b27,#a92a19);color:#fff}
.btn.danger small,.btn.red small{opacity:1}
.btn.ghost{background:#ffffff13;color:var(--ink);box-shadow:0 5px 0 #0008,inset 0 0 0 1.5px #ffffff2c}
.btn:disabled{opacity:.42;filter:saturate(.4)}
.btn.wide{width:100%}
.dock[data-armed=false] .d-actions .btn{opacity:.78}
.act-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.act{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 3px;border-radius:13px;background:#ffffff0f;border:1.5px solid #ffffff22;transition:transform .1s,border-color .2s}
.act:active:not(:disabled){transform:scale(.94)}
.act .art{width:76%;aspect-ratio:.68;object-fit:contain;filter:drop-shadow(0 3px 4px #000a)}
.act .sym{width:76%;aspect-ratio:.68;display:grid;place-items:center;border-radius:7px;background:linear-gradient(160deg,#2f8a76,#185145);border:1px solid #ffffff33;font:700 17px/1 var(--font);color:#fff1c4;direction:ltr}
.act .an{font-size:12px;font-weight:700;max-width:100%;line-height:1.15;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act .short{font-size:12px;font-weight:700;line-height:1.2;color:#ffb98a}
.act .cost{position:absolute;top:-7px;inset-inline-end:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;display:grid;place-items:center;background:var(--orange);color:#2a1300;font-size:12px;font-weight:700;box-shadow:0 2px 4px #0009}
.act.held{border-color:var(--gold);background:#f4c55c1c}
.act.held::after{content:'✓';position:absolute;top:-7px;inset-inline-start:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a1904;font-size:12px;font-weight:700;box-shadow:0 2px 4px #0009}
.act.bluff{border-style:dashed;border-color:#b48cff66}
.act:disabled>:not(.short){opacity:.36}
.act:disabled .short{color:#ffc29e}
.pick-head{display:flex;align-items:center;gap:10px}
.pick-head .d-art{width:44px}
.targets{display:flex;gap:6px}
.tgt{flex:1;min-width:0;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px;border-radius:15px;background:#ffffff10;border:2px solid #ffffff26;font-weight:700;font-size:13px}
.tgt .mf{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--c)}
.tgt small{display:block;font-size:12px;color:var(--gold);font-weight:700}
.tgt.selected,.tgt[aria-pressed=true]{border-color:var(--gold);background:#f4c55c26}
.named{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.named button{aspect-ratio:.68;padding:2px;border-radius:8px;border:2px solid #ffffff26;background:#0003}
.named button img{width:100%;height:100%;object-fit:contain}
.named button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 3px #f4c55c55;transform:translateY(-3px)}
.pick{display:flex;justify-content:center;gap:8px;padding:6px 0 4px}
.pick button,.pick .shown{position:relative;width:min(16.5vw,72px);aspect-ratio:.68;padding:2px;border-radius:10px;border:2px solid #ffffff2c;background:#0003;transition:transform .15s}
/* v3.1: a block picture at its own height (WebKit, as on iPhone, drew it 12 px taller from height:100% inside
   the aspect-ratio button, which made the exchange prompt taller); a refused picture keeps the card shape. */
.pick img{display:block;width:100%;height:auto;aspect-ratio:auto .68;object-fit:contain}
.pick button[aria-pressed=true]{border-color:var(--gold);transform:translateY(-7px);box-shadow:0 8px 16px #000a,0 0 0 3px #f4c55c55}
.pick .lbl{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);padding:0 6px;border-radius:7px;background:#17132f;border:1px solid #ffffff33;font-size:12px;font-weight:700;white-space:nowrap}
.pick button[aria-pressed=true] .lbl{background:var(--gold);color:#2a1904}
.pick .shown{border-color:#e3f2ff;box-shadow:0 0 22px #e3f2ff44;animation:flip .55s ease-out both}
.accused-role{width:30px;aspect-ratio:.68;object-fit:contain;border:1.5px dashed var(--gold);border-radius:4px;padding:1px}
.result{display:flex;align-items:center;gap:12px}
.result .big{font-size:44px;line-height:1}
.result .icon-btn{color:var(--muted)}
.result h1{margin:0;font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{padding:6px 2px;border-radius:12px;background:#ffffff0f;text-align:center}
.stat b{display:block;font-size:19px;color:var(--gold)}.stat small{font-size:12px;color:var(--muted);font-weight:700}

/* Sheets */
dialog.sheet{position:fixed;inset:auto 0 0;margin:0 auto;width:100%;max-width:520px;max-height:88dvh;padding:0;border:0;border-radius:24px 24px 0 0;background:linear-gradient(#221c44,#16122d);color:var(--ink);box-shadow:0 -18px 50px #000d;overflow:auto;overscroll-behavior:contain}
dialog.sheet[open]{animation:sheet-up .32s cubic-bezier(.2,.9,.3,1)}
/* Older browsers without <dialog>: hidden until opened, above the table when open. */
dialog:not([open]){display:none}
dialog[open]{display:block;z-index:100}
dialog.sheet::backdrop{background:#05040cc4;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-body{padding:6px 16px calc(16px + var(--safe-b))}
.grab{width:46px;height:5px;margin:4px auto 2px;border-radius:3px;background:#ffffff44}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grab,.sheet-head{touch-action:none}
.sheet-head h2{margin:8px 0;font-size:19px;font-weight:700}
.sheet-head h2:focus{outline:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:#ffffff14}
#detail-content{font-size:14px;line-height:1.7;color:#e0dcf2}
#detail-content p{margin:8px 0}
#close-detail-bottom{margin-top:14px}
.menu-list{display:grid;gap:8px;margin-top:6px}
.menu-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:#ffffff10;border:1px solid #ffffff1e;font-weight:700;font-size:15px;text-align:start}
.menu-item .i{width:22px;height:22px;color:var(--gold)}
.menu-item small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.toggle{min-height:56px;border-radius:16px;background:#ffffff10;border:1.5px solid #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.toggle .i{width:20px;height:20px}
.toggle[aria-pressed=true]{color:var(--gold);border-color:var(--gold);background:#f4c55c14}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff14;font-size:14px;font-weight:700}
.setting-row select,.setting-row input{min-height:46px;max-width:58%;padding:6px 10px;border-radius:12px;background:#0005;border:1px solid #ffffff33;color:var(--ink);font:inherit;font-size:14px}
.setting-row small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pd{display:flex;align-items:center;gap:12px}
.pd .d-face{width:58px;height:58px;font-size:32px}
.pd b{font-size:18px}.pd small{display:block;color:var(--muted);font-size:12px}
.meter{display:flex;align-items:center;gap:8px;margin:12px 0}
.meter img{width:26px;height:26px}.meter b{font-size:20px;color:var(--gold);min-width:26px}
.meter .bar{flex:1;height:8px;border-radius:5px;background:#ffffff16;overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--gold)}
.cards-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:30px}
.cards-row img{width:48px;aspect-ratio:.68;object-fit:contain}
.zoom{display:flex;gap:14px;align-items:flex-start}
.zoom img{width:42%;max-width:170px;aspect-ratio:.68;object-fit:contain;filter:drop-shadow(0 8px 14px #000b)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.steps{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:13.5px}
.steps li .step{width:30px;height:30px}.steps li .step .i{width:15px;height:15px}.steps li .step img{width:15px;height:22px}
.steps li.next,.steps li.skip,.steps li.void{opacity:.6}.steps li.now{color:#fbe9bf;font-weight:700}
.changes{display:grid;gap:6px;padding-top:8px;border-top:1px solid #ffffff16}
.chg-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;border:1px solid #ffffff2c;font-size:12.5px;font-weight:700}
.chg img{width:15px;height:18px;object-fit:contain}.chg .i{width:14px;height:14px}
.chg.negative{color:#ffb5a8;border-color:#ac7069}.chg.positive{color:var(--gold);border-color:#a48d66}
.log-row{padding:8px 0;border-bottom:1px solid #ffffff12;font-size:13px;line-height:1.6}
.log-row small{display:block;color:var(--gold);font-size:12px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #ffffff12}
.rule img{width:52px;aspect-ratio:.68;object-fit:contain;flex:none}
.rule h3{margin:0 0 3px;font-size:15px;color:var(--gold)}
.rule p{margin:0!important;font-size:13px}
details{margin-top:10px;border-top:1px solid #ffffff14;padding-top:8px}
summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--gold);cursor:pointer}

/* First-run intro */
dialog.intro{position:fixed;inset:0;width:100%;max-width:520px;height:100%;max-height:none;margin:0 auto;padding:0;border:0;color:var(--ink);background:radial-gradient(120% 80% at 50% 25%,#2e2f6e,#120f29 70%)}
dialog.intro::backdrop{background:#06050d}
.slides{height:100%;display:flex;flex-direction:column;padding:calc(18px + var(--safe-t)) 20px calc(18px + var(--safe-b))}
.slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;animation:dock-in .35s both}
.slide h2{margin:0;font-size:26px;font-weight:700}
.slide p{margin:0;font-size:16px;line-height:1.7;color:#ddd8f2;max-width:330px}
.slide .pics{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.slide .pics img{width:min(24vw,96px);aspect-ratio:.68;object-fit:contain;filter:drop-shadow(0 8px 12px #000b)}
.slide .pics img:nth-child(1){transform:rotate(-8deg)}.slide .pics img:nth-child(3){transform:rotate(8deg)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:4px;background:#ffffff33}.dots i.on{width:22px;background:var(--gold)}
.intro-actions{display:flex;gap:10px}
.intro-actions .btn{flex:1}
.brand{text-align:center;font:700 13px/1 var(--font);letter-spacing:4px;color:var(--gold)}
.brand b{display:block;margin-top:6px;font-size:40px;letter-spacing:0;color:var(--ink)}

@keyframes pop{from{transform:scale(0)}}
@keyframes bump-up{35%{transform:scale(1.45);color:#fff8d8}}
@keyframes bump-down{35%{transform:scale(1.3);color:#ff9d8e}}
@keyframes shake{15%{transform:translateX(-7px) rotate(-5deg)}35%{transform:translateX(7px) rotate(5deg)}55%{transform:translateX(-5px)}75%{transform:translateX(4px)}}
@keyframes shield{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.3)}}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--felt-edge),0 0 0 6px var(--gold),0 0 30px var(--gold)}}
@keyframes peek{30%{transform:translateY(-6px) scale(1.12)}}
@keyframes shuffle{25%{transform:translateX(-6px) rotate(-6deg)}50%{transform:translateX(6px) rotate(6deg)}75%{transform:translateX(-3px)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes beckon{50%{transform:scale(1.09);box-shadow:0 0 0 3px var(--felt-edge),0 0 0 6px var(--gold),0 0 24px #f4c55c}}
@keyframes beat{50%{transform:scale(1.15)}}
@keyframes urgent{50%{transform:scale(1.08)}}
@keyframes bubble-in{from{opacity:0;transform:translate(-50%,10px) scale(.45)}}
@keyframes bubble-out{to{opacity:0;transform:translate(-50%,-8px) scale(.9)}}
@keyframes bubble-in-up{from{opacity:0;transform:translate(-50%,20%) scale(.45)}}
@keyframes bubble-out-up{to{opacity:0;transform:translate(-50%,-15%) scale(.9)}}
@keyframes dock-in{from{opacity:0;transform:translateY(16px)}}
@keyframes sheet-up{from{transform:translateY(55%);opacity:.4}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(.96)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes flip{0%{transform:perspective(500px) rotateY(90deg);opacity:.2}100%{transform:perspective(500px) rotateY(0);opacity:1}}
@keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-10deg)}60%{opacity:1;transform:scale(.94) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
@keyframes drop{from{transform:translateY(-16px) rotate(-12deg);opacity:0}}
@keyframes spin-in{from{transform:rotateY(180deg) scale(.4);opacity:0}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes link-in{from{opacity:0;stroke-dashoffset:40}}

/* Calm motion: same information, no movement. */
.reduced *,.reduced *::before,.reduced *::after{animation:none!important;transition:none!important}

/* Shorter phones */
@media (max-height:760px){:root{--card:clamp(58px,19vw,82px);--av:clamp(42px,12.4vw,54px)}.hud{min-height:46px}.btn{min-height:52px;font-size:15px}.dock{gap:7px;padding-top:11px}#seat-bot1,#seat-bot3{margin-top:18px}}
@media (max-height:680px){:root{--card:clamp(52px,16.5vw,70px);--av:clamp(38px,11.5vw,46px);--mini:15px}.hud{min-height:42px;padding-block:3px}.hud{min-height:46px}.hud-btn{width:44px;height:44px}.turn-chip{height:34px}.btn{min-height:48px;font-size:14.5px;border-radius:15px}.btn small{font-size:12px}.dock{min-height:108px;padding:10px 10px calc(10px + var(--safe-b));gap:6px}.d-head h1{font-size:15.5px}.d-head p{font-size:12px}.d-face{width:36px;height:36px;font-size:20px}.act .an{font-size:12px}.act{padding-block:4px 2px}.named{gap:4px}.tgt{min-height:46px}.trace{min-height:44px;padding-block:3px}.seat-label{font-size:12px}.claim-chip{font-size:12px}#seat-bot1,#seat-bot3{margin-top:14px}}
@media (max-height:600px){:root{--card:clamp(48px,14vw,62px);--av:36px;--mini:14px}.btn{min-height:46px}.act .sym{font-size:14px}.dock{min-height:100px}}

/* Landscape phones: table left, dock right. */
@media (orientation:landscape) and (max-height:560px){
 :root{--card:clamp(40px,12.5vh,60px);--av:clamp(32px,10vh,44px);--mini:13px}
 .game{max-width:none;grid-template-columns:minmax(0,1fr) clamp(250px,40vw,360px);grid-template-rows:auto minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
 .hud{grid-column:1/-1;min-height:46px;padding-block:1px}.hud-btn{width:44px;height:44px}.turn-chip{height:34px}
 .table{grid-column:1;grid-row:2;margin:0 6px 6px;border-radius:24px;grid-template-columns:minmax(0,1fr) minmax(0,auto);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:'opp opp' 'mid trace' 'me me'}
 .opponents{grid-area:opp}.middle{grid-area:mid}#seat-human{grid-area:me}
 .trace{grid-area:trace;align-self:center;max-width:min(210px,30vw);flex-direction:column;align-items:flex-start;gap:3px;margin:0 4px}
 .trace-text{max-width:100%}
 .dock{grid-column:2;grid-row:2;margin:0 6px 6px 0;border-radius:20px;min-height:0;max-height:none;overflow:auto;padding:12px 10px}
 .dock>.d-actions{margin-top:auto}
 #seat-bot1,#seat-bot3{margin-top:10px}
 .nm{font-size:12px}.purse{font-size:13px}.purse img{width:16px;height:16px}.seat-label{font-size:12px;min-height:13px}.claim-chip{font-size:12px;margin-top:1px}.seat.opp .who{gap:8px}
 .hand{min-height:calc(var(--card) * 1.47 + 4px);padding-top:4px}.me-bar{min-height:30px;margin-top:0}
 .trace{min-height:44px;margin:1px 0 2px;padding:2px 8px}.step{width:20px;height:20px}
 .btn{min-height:46px;font-size:14px}.act .an{font-size:12px}.act-grid{gap:4px}
 .result p{display:none}.result .big{font-size:32px}.result h1{font-size:18px}.stat{padding:4px 2px}.stat b{font-size:16px}.dock{gap:7px}
 dialog.sheet{max-width:560px;max-height:94dvh}
}
@media (min-width:700px) and (min-height:700px){body{background:radial-gradient(circle at 50% 30%,#1d1a3a,#06050d 70%)}.game{border-left:1px solid #ffffff14;border-right:1px solid #ffffff14}}

.btn img{width:20px;height:20px;object-fit:contain}
.info-art{flex:none;display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:8px}
@container (max-height:150px){.stage .duel{display:none}}
@container (max-height:110px){.stage .stamp{display:none}}

/* Short tables: smaller seats and hand so nothing slides under the dock. */
@container (max-height:430px){.opp{--av:clamp(36px,11vw,46px)}#seat-bot1,#seat-bot3{margin-top:12px}.seat.me{--card:clamp(48px,14.5vw,62px)}.seat-label{display:none}.trace{min-height:44px;padding-block:2px;margin-block:0 1px}.me-bar{min-height:34px}.seat.opp .who{gap:8px}}
@container (max-height:340px){.opp{--av:34px;--mini:13px}.seat.me{--card:44px}.claim-chip{font-size:12px;padding-block:0;margin-top:1px}.claim-chip img{width:11px;height:16px}.nm{font-size:12px}.purse{font-size:13px}.purse img{width:15px;height:15px}#seat-bot1,#seat-bot3{margin-top:8px}}
@media (max-height:740px){.act .art,.act .sym{width:64%}.act{padding-block:4px 2px}.pick button,.pick .shown{width:min(14.5vw,60px)}}
@media (max-height:640px){.act .art,.act .sym{width:56%}.act .an{font-size:12px}.pick button,.pick .shown{width:min(13vw,52px)}.d-head h1{font-size:15px}.tip{font-size:12px}}
.zoom .stage-card{flex:none;animation:none}.zoom .stage-card img{width:clamp(70px,26vw,110px);height:auto}
.zoom>div{min-width:0;flex:1}

/* v2: coach, quick pass, auto-play, claim history, end-of-game reveal */
.coach{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:12px;background:#2f8a7633;border:1.5px solid #5fd3b5aa;color:#dff8ef;font-size:13px;line-height:1.5;font-weight:700}
.coach .i{width:18px;height:18px;flex:none;margin-top:2px;color:#7fe6c8}
.skip-turn,.link-btn{align-self:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;color:var(--muted);font-size:13px;font-weight:700}
.skip-turn{border:1px dashed #ffffff3a}
.skip-turn .i,.link-btn .i{width:16px;height:16px}
.skip-turn .i{fill:currentColor;stroke:none}
.auto-bar{height:6px;border-radius:3px;background:#ffffff1c;overflow:hidden}
.auto-bar i{display:block;height:100%;background:var(--gold);transform-origin:right center;animation:auto-fill linear both}
@keyframes auto-fill{from{transform:scaleX(0)}}
.hist{margin:10px 0 4px}
.hist>small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.hist>div{display:flex;flex-wrap:wrap;gap:6px}
.hist-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:9px;border:1.5px dashed var(--gold);background:#0b231fcc;color:#ffe3a3;font-size:12.5px;font-weight:700}
.hist-chip img{width:14px;height:21px;object-fit:contain}
.muted{color:var(--muted)}
.reveal-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #ffffff14}
.reveal-body{min-width:0;flex:1}
.reveal-body b{font-size:15px}.reveal-body>small{display:block;color:var(--muted);font-size:12px}
.reveal-cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rc{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px}
.rc img{width:52px;aspect-ratio:.68;object-fit:contain;border-radius:6px}
.rc i{font-style:normal;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.rc small{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.rc.kept img{outline:2px solid var(--good);outline-offset:1px}
.rc.lost img{filter:grayscale(.7) brightness(.62);outline:2px solid var(--bad);outline-offset:1px}

/* v3: reveal card, notes, stakes, role briefs */
/* While a claim waits for its verdict (and for a lie) the stage shows a face-down card. */
/* The reveal when you are involved: a big card over the felt, never over the dock or the timer. */
.reveal-layer{position:absolute;left:50%;top:40%;height:clamp(110px,40%,240px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:36;pointer-events:none;animation:card-in .3s cubic-bezier(.2,1.3,.4,1) both}
.reveal-layer::before{content:'';position:absolute;inset:-30% -60%;z-index:-1;background:radial-gradient(closest-side,#000a,transparent);pointer-events:none}
.rv-card{position:relative;flex:1;min-height:0;aspect-ratio:.68;border-radius:12px;padding:3px;border:2.5px dashed var(--gold);background:#0b231fcc;box-shadow:0 12px 30px #000c}
.rv-card img{display:block;width:100%;height:100%;object-fit:contain}
.reveal-layer[data-state=wait] .rv-card{animation:wobble .9s ease-in-out infinite}
.reveal-layer[data-state=truth] .rv-card{border:2.5px solid #e3f2ff;box-shadow:0 0 30px #e3f2ff88,0 12px 30px #000c}
.reveal-layer[data-state=lie] .rv-card{border:2.5px solid #ff6b6b}
.reveal-layer[data-state=lie] .rv-card img{filter:brightness(.55)}
.rv-card .x{position:absolute;inset:0;display:grid;place-items:center;color:#ff6b6b;font-size:clamp(40px,12vh,90px);font-weight:700;text-shadow:0 3px 10px #000}
.rv-card.flip{animation:flip .55s ease-out both}
/* While the big card is up, the stage under it is hidden (one picture at a time). */
.table.revealing #center>*{visibility:hidden}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-3px)}}
/* A note over the felt: save and storage warnings only. */
.toast-slot{position:absolute;inset-inline:10px;top:34%;z-index:38;display:flex;justify-content:center;pointer-events:none}
/* Landscape: the note covers the stage side of the table, not the step rail. */
@media (orientation:landscape) and (max-height:560px){.toast-slot{inset-inline-end:auto;width:56%;top:30%}}
.toast{pointer-events:auto;cursor:pointer;display:flex;align-items:flex-start;gap:8px;max-width:360px;padding:9px 12px;border-radius:14px;background:#211b45f2;border:1.5px solid #f4c55c88;box-shadow:0 10px 26px #000c;color:#fbefcf;font-size:13px;line-height:1.5;font-weight:700;animation:dock-in .25s both}
.toast.warn{border-color:#ff9c8daa}
.toast>.i{width:18px;height:18px;flex:none;margin-top:2px;color:var(--gold)}
.toast span{flex:1;min-width:0}
/* Banners can carry an icon. */
.banner{display:flex;align-items:center;gap:8px}
.banner .i{width:.9em;height:.9em;stroke-width:2.6}
/* Lethal stakes: this answer can cost your last card. A red edge and a ribbon; the dock keeps its height. */
.dock[data-stakes=lethal]{box-shadow:0 -12px 30px #000b,inset 0 0 0 2px #ff6b6bcc,inset 0 0 22px #ff6b6b33}
.stake-chip{display:inline-block;margin-inline-end:6px;padding:0 7px;border-radius:7px;background:#c8302f;color:#fff;font-size:12px;font-weight:700;line-height:1.6;vertical-align:2px}
.dock[data-stakes=last] .stake-chip{background:#5b4a1d;color:#ffe9b3}
/* In a coached step the coach's note replaces the reason line. */
.dock[data-coached=true] .d-head p{display:none}
/* Role briefs: a second line on the action tiles where there is room. */
.act .act-sub{display:none;font-size:12px;font-weight:700;line-height:1.2;color:#d8d2f0;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Only on tall, wide screens: on 390x844 the extra line would squeeze the stage below a 44 px target. */
@media (min-width:410px) and (min-height:880px){.act .act-sub{display:block}}
.info-art{position:relative}
.info-dot{position:absolute;bottom:-2px;inset-inline-start:-4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#2f8a76;color:#fff;border:2px solid #17132f;font:italic 900 12px/1 Georgia,serif}
/* The Colonel's accusation: labelled chips, 4 + 3. */
.named{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.named button{aspect-ratio:auto;min-height:44px;display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:10px;border:2px solid #ffffff26;background:#0003;font-size:12px;font-weight:700;line-height:1.15;text-align:start}
.named button img{width:20px;height:29px;flex:none;object-fit:contain}
.named button span{min-width:0}
.named button[aria-pressed=true]{border-color:var(--gold);background:#f4c55c26;box-shadow:0 0 0 2px #f4c55c55;transform:none}
.named button:disabled{opacity:.36}
/* Card names while you choose a card to lose. */
.hand-name{position:absolute;left:2px;right:2px;bottom:4px;padding:1px 2px;border-radius:6px;background:#17132fee;color:#fff;font-size:12px;font-weight:700;line-height:1.2;text-align:center;white-space:normal;overflow-wrap:anywhere;pointer-events:none}
@media (orientation:landscape) and (max-height:560px) and (max-width:780px){.act-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.act .an{font-size:12px}}
/* Narrow landscape panels: accusation chips in 3 columns with the name under the picture; badges clear of names. */
@media (orientation:landscape) and (max-height:560px) and (max-width:780px){.named{grid-template-columns:repeat(3,minmax(0,1fr))}.named button{flex-direction:column;justify-content:center;text-align:center;gap:1px;padding:3px 2px}.named button img{width:18px;height:26px}}
@media (orientation:landscape) and (max-height:560px){.seat.opp .who{gap:11px}}

/* v3 loop 2: Machine threat, story, Tax-batch reveal, intro form, diagnostics */
/* 7+ coins can buy the Machine; red with «!» when it could take your card and you could not pay 9. */
.threat{position:absolute;top:-5px;inset-inline-end:-7px;z-index:3}
.tchip{position:relative;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#1d2a40;border:2px solid #f4c55c;color:#f4c55c;box-shadow:0 2px 4px #0009}
.tchip .i{width:12px;height:12px;stroke-width:2.4}
.tchip.danger{background:#4a1111;border-color:#ff6b6b;color:#ffd0c8}
.tchip b{position:absolute;top:-7px;inset-inline-start:-7px;min-width:13px;height:13px;border-radius:7px;display:grid;place-items:center;background:#c8302f;color:#fff;font-size:12px;line-height:1;font-weight:700}
/* The story sheet (after the game only). */
.story-head{display:flex;flex-direction:column;gap:2px;margin:4px 0 10px}
.story-place{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--gold)}
.story-place .i{width:22px;height:22px}
.story-head small{color:var(--muted);font-size:13px}
.story-list{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}
.story-list li{display:flex;gap:8px;align-items:center;font-weight:700}
.story-list .i{width:18px;height:18px;color:var(--good);flex:none}
.story-h{font-size:15px;margin:12px 0 4px;color:var(--gold)}
.story-seat{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #ffffff12}
.story-seat .d-face{width:34px;height:34px;font-size:19px}
.story-seat small{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px}
.story-lesson{display:flex;gap:8px;align-items:flex-start;margin:12px 0;padding:10px;border-radius:12px;background:#2f8a7633;border:1.5px solid #5fd3b5aa;color:#dff8ef;line-height:1.6}
.story-lesson .i{width:18px;height:18px;flex:none;margin-top:3px;color:#7fe6c8}
.story-note{font-size:12px;margin:6px 0}
.story-links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
/* The big reveal for a Tax batch you are in: one card per picked claimant. */
.reveal-layer.batch{height:clamp(110px,34%,220px);max-width:calc(100% - 24px)}
.rv-row{flex:1;min-height:0;display:flex;gap:10px;justify-content:center}
.rv-item{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0}
.rv-item .rv-card{flex:1;min-height:0}
.rv-item[data-state=truth] .rv-card{border:2.5px solid #e3f2ff;box-shadow:0 0 24px #e3f2ff77}
.rv-item[data-state=lie] .rv-card{border:2.5px solid #ff6b6b}
.rv-item[data-state=lie] .rv-card img{filter:brightness(.55)}
.reveal-layer.batch[data-state=wait] .rv-card{animation:wobble .9s ease-in-out infinite}
/* Intro: meet the bots, then your name and form. */
.intro-faces{display:flex;gap:14px;justify-content:center}
.intro-faces .d-face{width:64px;height:64px;font-size:36px}
.intro-form{display:grid;gap:10px;width:100%;max-width:300px;margin-top:6px}
.intro-form label{display:flex;flex-direction:column;gap:4px;text-align:start;font-weight:700;font-size:14px}
.intro-form input,.intro-form select{min-height:46px;padding:6px 10px;border-radius:12px;background:#0005;border:1px solid #ffffff33;color:var(--ink);font:inherit;font-size:15px}
/* ?diag overlay for checks on a real phone. */
#diag{position:fixed;top:4px;left:4px;z-index:200;max-width:62vw;padding:6px 8px;border-radius:8px;background:#000d;color:#a6f5a6;direction:ltr;text-align:left}
#diag pre{margin:0;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
#diag .link-btn{min-height:30px;padding:0 8px;color:#fff}

/* Loop 2: stable table, one button rule, one close, the log while you wait */
/* Two dock heights: compact while others play or you react, fuller when you choose (action, target,
   cards, Tax picks, the end). The hand moves less between prompts; a rare tall state may still grow. */
.dock{min-height:max(108px,22dvh)}
/* U6 (loop 3): on tall phones the fuller height stays within 76 px of the compact one. */
.dock[data-mode=action],.dock[data-mode=targets],.dock[data-mode=exchange],.dock[data-mode=inspect],.dock[data-mode=policeDecision],.dock[data-mode=end]{min-height:min(31dvh,calc(22dvh + 76px))}
@media (orientation:landscape) and (max-height:560px){.dock,.dock[data-mode]{min-height:0}}
/* Action tiles show the character's face, not the whole card, and every name stays on one line: the
   columns take their width from the names (one column a little wider for «عامل ضرائب»), pictures and
   sub-lines add nothing to it (width 0, stretched back to the tile), and «يلزم 2» sits on the picture. */
.act-grid{grid-template-columns:repeat(5,minmax(max-content,1fr))}
.act .art,.act .sym{width:0;min-width:100%;height:clamp(36px,6.2dvh,58px);aspect-ratio:auto;border-radius:8px}
.act .art{object-fit:cover;object-position:50% 30%}
.act .an{display:block;white-space:nowrap}
.act .act-sub{width:0;min-width:100%}
.act .short{position:absolute;inset-inline:0;top:calc(5px + clamp(36px,6.2dvh,58px) / 2);transform:translateY(-50%);width:fit-content;margin-inline:auto;padding:1px 7px;border-radius:9px;background:#120f26e0;pointer-events:none}
@media (max-height:740px){.act .short{top:calc(4px + clamp(36px,6.2dvh,58px) / 2)}}
@media (orientation:landscape) and (max-height:560px) and (max-width:780px){.act-grid{grid-template-columns:repeat(4,minmax(max-content,1fr))}}
/* Below 300 px the names may wrap again rather than push the grid wider than the screen. */
@media (max-width:300px){.act-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.act .an{white-space:normal}}
/* The quick-pass control sits at the end of the prompt header instead of a row of its own. */
.d-head .skip-turn{flex:none;align-self:center;max-width:108px;min-height:44px;padding:2px 8px;font-size:12px;line-height:1.25;text-align:center;white-space:normal;border-radius:12px}
/* The latest public lines while others decide. */
.d-log{display:grid;gap:2px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.d-log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-log p:first-child{color:#dcd7f2}
/* Sheet buttons put their icon beside the text; a sheet has one close (the ✕ or a swipe). */
.btn:not(:has(.btn-row)){flex-direction:row;gap:6px}
#close-detail-bottom{display:none}
/* Bold never goes past 700, even inside bold text (coin counts, signed numbers). */
b,strong{font-weight:700}
/* Numbers keep fixed-width digits after any font shorthand. */
.delta,.lost-slot,.loss-mark,.coin-burst,.act .sym,.act .cost,.clock{font-variant-numeric:tabular-nums}
/* Loop 3 */
/* T1: your own ring stays full and breathes on the compositor while you answer; colour only with reduced motion. */
.seat.self-timed .ring{animation:ring-breathe 1.4s ease-in-out infinite alternate}
@keyframes ring-breathe{to{opacity:.5}}
.reduced .seat.self-timed .ring{animation:none}
/* U1: buttons and the action grid sit at the bottom of the dock; the spare height is above them, within thumb reach. */
.dock>.d-actions,.dock>.act-grid{margin-top:auto}
/* U4: on short screens the accusation step drops the brief it repeats (ⓘ keeps it) and the exchange its sub-line. */
@media (max-height:680px){
  .dock[data-step=named] .d-head p,.dock[data-mode=exchange] .d-head p{display:none}
  .dock[data-step=named] .d-head .d-art,.dock[data-mode=exchange] .d-head .d-art{width:26px}
  .dock[data-step=named],.dock[data-mode=exchange]{gap:4px;padding-top:8px}
  .dock[data-step=named]{padding-top:0}
  .dock[data-step=named] .d-actions .btn,.dock[data-mode=exchange] .d-actions .btn{min-height:44px}
  .dock[data-step=named] .named{gap:4px}
  .dock[data-mode=exchange] .pick button{width:48px}
}
/* U2: seat bubbles (who was right) stay above the big reveal cards. */
#fx .bubble{z-index:37}
/* F1: your seat reacts to your own news (individual scale/rotate, so the seat's own transform stays). */
.seat.react-good .avatar{animation:react-pop .5s cubic-bezier(.2,1.6,.4,1)}
.seat.react-bad .avatar{animation:react-shake .4s ease-in-out}
.seat.react-good .ring,.seat.react-bad .ring{--ring:1;animation:react-ring .65s ease-out}
.seat.react-good .ring{--ring-c:var(--gold)}.seat.react-bad .ring{--ring-c:var(--bad)}
@keyframes react-pop{0%{scale:1}40%{scale:1.16}100%{scale:1}}
@keyframes react-shake{0%,100%{rotate:0deg}25%{rotate:-7deg}55%{rotate:6deg}80%{rotate:-3deg}}
@keyframes react-ring{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* F3: the gold spark from your seat and a ring flash on the seat you knocked out. */
.fly.spark{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff6c8 0,#f4c55c 55%,#f4c55c00 72%)}
.seat.ko-flash .ring{--ring:1;--ring-c:var(--gold);animation:react-ring .9s ease-out}
/* F4: the attacker's ratchet while its Machine turns. */
.seat.ratchet .avatar{animation:ratchet .95s steps(8,end)}
@keyframes ratchet{0%,100%{rotate:0deg}20%{rotate:-9deg}45%{rotate:7deg}70%{rotate:-4deg}}
.reduced .seat.react-good .avatar,.reduced .seat.react-bad .avatar,.reduced .seat.ratchet .avatar{animation:none}
/* L1: a starter hint sits in the dock's spare band, under the prompt's header. */
.d-head .d-copy .d-hint{margin:0;font-size:12.5px;line-height:1.35;color:#f4dfa6}
/* U8: up to four lines while a bot decides on tall screens, two elsewhere. */
.d-log p:nth-child(n+3){display:none}
@media (min-height:800px){.d-log p:nth-child(n+3){display:block}}
/* F7: the final duel: a darker felt edge, and both rims pulse three times. */
.table.duel{box-shadow:inset 0 0 70px 14px #000a}
.seat.duel-rim .ring{--ring:1;--ring-c:#ff8a5c;animation:react-ring .8s ease-in-out 3}
/* L6: the intro fits short landscape screens without scrolling. */
@media (max-height:440px){
  .slides{padding:calc(8px + var(--safe-t)) 16px calc(8px + var(--safe-b))}
  .slide{gap:8px}
  .slide h2{font-size:20px}
  .slide p{font-size:14px;line-height:1.5;max-width:560px}
  .slide .pics img{width:min(9vw,58px)}
  .intro-faces .d-face{width:44px;height:44px;font-size:26px}
  .intro-form{grid-template-columns:1fr 1fr;max-width:480px;gap:8px}
  .intro-form input,.intro-form select{min-height:44px}
}
.reveal-layer.batch .rv-item{flex:1 1 0;min-width:0}
/* v3.1: pictures a viewer refuses (html[data-art=none]) become drawn faces in the art's colours:
   no empty frames or spilled alt text, and your own cards show their names. */
html[data-art=none] img{box-sizing:border-box;color:transparent;font-size:0;border:1.5px solid #ffffff3d;border-radius:6px;background:linear-gradient(165deg,var(--face,#4a3f86),#15112b 92%)}
html[data-art=none] img[data-r=coin1]{border-color:#ffd36f;border-radius:50%;background:radial-gradient(circle at 36% 32%,#ffe6a8,#e2a33b 52%,#94561a)}
html[data-art=none] img[data-r=back]{border-color:#f2c35b66;background:repeating-linear-gradient(135deg,#2c2356 0 4px,#1b1638 4px 8px)}
html[data-art=none] img[data-r=colonel]{--face:#6f7f34}
html[data-art=none] img[data-r=terrorist]{--face:#94384a}
html[data-art=none] img[data-r=thief]{--face:#b9553a}
html[data-art=none] img[data-r=police]{--face:#3f66b8}
html[data-art=none] img[data-r=businesswoman]{--face:#c99d24}
html[data-art=none] img[data-r=fisc]{--face:#3d8c5d}
html[data-art=none] img[data-r=politician]{--face:#7a55b8}
html[data-art=none] .pick .hand-name{bottom:auto;top:50%;transform:translateY(-50%)}

/* Online table (src/online.js): join sheet, lobby and table info. */
.net-join{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.net-join input{flex:1;min-width:0;min-height:56px;border-radius:17px;border:1.5px solid #ffffff2c;background:#ffffff10;color:var(--ink);font:800 22px/1 var(--font);letter-spacing:.18em;text-align:center;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.net-join .btn{min-width:96px}
.net-msg{min-height:22px;margin:10px 0 0;font-weight:700;font-size:14px;color:var(--bad);text-align:center}
.net-msg.ok{color:var(--good)}
.net-code{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.net-code b{direction:ltr;font-size:clamp(30px,9vw,40px);letter-spacing:.16em;padding:4px 16px;border-radius:14px;border:2px dashed #f4c55c88;color:var(--gold);-webkit-user-select:all;user-select:all}
.net-seats{display:grid;gap:8px;margin:10px 0}
.net-seat{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff1a}
.net-seat.open{opacity:.7}
.net-seat div{flex:1;min-width:0}
.net-seat b{display:block;font-size:15px}
.net-seat small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.net-badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffffff1c;color:var(--ink)}
.net-badge.you{background:var(--gold);color:#2a1904}
.net-badge.bot{background:#ffffff10;color:var(--muted)}
.net-opts{display:grid;gap:0;margin:4px 0 12px}
</style>
</head>
